spring:
  application:
    name: ${SPRING_APPLICATION_NAME:authzen}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/authzen_db?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
  security:
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:Admin@123}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:youremail@gmail.com}
    password: ${MAIL_PASSWORD:yourapppassword}
    protocol: smtp
    tls: true
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  web:
    resources:
      static-locations: classpath:/static/

jwt:
  secret: ${JWT_SECRET:}
  access-token:
    expiry-ms: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-token:
    expiry-ms: ${JWT_REFRESH_EXPIRATION:604800000}

server:
  port: ${SERVER_PORT:8080}

email:
  from: ${EMAIL_FROM:noreply@yourdomain.com}

github:
  client-id: ${GITHUB_CLIENT_ID:Ov23lilQZqCbo1kZDaDP}
  client-secret: ${GITHUB_CLIENT_SECRET:bdbd652d514d568256a1fad7823aa5a467859999}
  redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/oauth/callback}

admin:
  email: ${ADMIN_EMAIL:admin@yourdomain.com}
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:Admin@123}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    display-request-duration: true